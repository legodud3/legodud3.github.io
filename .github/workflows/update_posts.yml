name: Build Post Index

on:
  push:
    paths:
      - 'posts/*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate posts.json
        run: |
          python3 -c '
          import os
          import json
          import re

          posts = []
          # Loop through files in posts/ directory
          for filename in os.listdir("posts"):
              if filename.endswith(".md"):
                  filepath = os.path.join("posts", filename)
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                      
                      # Extract title and date using Regex
                      title_match = re.search(r"^title:\s*(.*)", content, re.MULTILINE)
                      date_match = re.search(r"^date:\s*(.*)", content, re.MULTILINE)
                      
                      title = title_match.group(1).strip().strip("\"'").strip() if title_match else filename
                      date = date_match.group(1).strip().strip("\"'").strip() if date_match else "Unknown"
                      
                      posts.append({"title": title, "date": date, "filename": filename})

          # Sort by date descending
          posts.sort(key=lambda x: x["date"], reverse=True)
          
          with open("posts.json", "w", encoding="utf-8") as f:
              json.dump(posts, f, indent=2)
          '

      - name: Commit posts.json
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add posts.json
          git commit -m "Update posts index" || echo "No changes to commit"
          git push
