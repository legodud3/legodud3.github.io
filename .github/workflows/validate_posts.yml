name: Validate Posts

on:
  pull_request:
    paths:
      - 'posts/**/*.md'
      # The validation logic itself lives in update_posts.py, so edits to the
      # validator or the indexer must be checked too.
      - 'update_posts.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the PR on missing/invalid dates, bad filenames
      # instead of letting posts silently sort to the bottom of the index.
      - name: Validate post metadata
        run: python3 update_posts.py --validate
