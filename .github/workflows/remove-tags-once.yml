name: Remove Blog Tag System (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and validate cleanup
        env:
          CLEANUP_SCRIPT: 
        run: |
          python3 -m pip install markdown
          printf '%s' "$CLEANUP_SCRIPT" | base64 --decode > /tmp/remove-blog-tags.py
          python3 /tmp/remove-blog-tags.py
          python3 update_posts.py --validate
          python3 update_posts.py
          python3 update_posts.py
          git diff --check
          python3 - <<'PY'
          import json, glob, re
          posts = json.load(open('posts.json', encoding='utf-8'))
          assert len(posts) == 53
          assert len(glob.glob('p/*.html')) == 53
          assert all(not any(key.startswith('tag_') for key in post) for post in posts)
          for page in glob.glob('p/*.html'):
              text = open(page, encoding='utf-8').read()
              assert 'post-tag' not in text and '[Reflection]' not in text
          assert 'tagFilters' not in open('index.html', encoding='utf-8').read()
          assert 'postTag' not in open('write.html', encoding='utf-8').read()
          print('Verified 53 posts/pages, no taxonomy metadata or tag UI.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/*'
          git commit -m "Remove blog tag system"
          git push origin HEAD:main
