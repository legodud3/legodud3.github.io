name: Generate Post Audio

on:
  push:
    paths:
      - 'posts/**/*.md'
      - '.github/workflows/generate_audio.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate audio even if .mp3 already exists'
        required: false
        default: 'false'
      target:
        description: 'Specific file (e.g. posts/2026/2026-03-21-foo.md), blank = all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: pip install requests

      - name: Detect changed markdown files
        if: github.event_name == 'push'
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'posts/**/*.md' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Generate audio (push)
        if: github.event_name == 'push'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          if [ -n "$FILES" ]; then
            python3 generate_audio.py $FORCE_FLAG $FILES
          else
            echo "No .md files changed."
          fi

      - name: Generate audio (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ]; then
            python3 generate_audio.py $FORCE_FLAG "$TARGET"
          else
            python3 generate_audio.py --all $FORCE_FLAG
          fi

      - name: Commit audio files
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          find posts -name "*.mp3" -print0 | xargs -0 --no-run-if-empty git add
          if git diff --cached --quiet; then
            echo "No audio changes to commit"
          else
            git commit -m "Generate audio for updated posts"
            git pull --rebase origin main
            git push
          fi
