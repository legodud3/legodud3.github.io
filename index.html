    <script>
        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'];

        let allPosts = [];
        let currentPage = 1;
        let activeMonth = null;
        const POSTS_PER_PAGE = 10;

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const monthFilterEl = document.getElementById('monthFilter');

        // Matches the "October 14, 2026" format the static post pages use.
        function formatDisplayDate(isoDate) {
            const match = typeof isoDate === 'string' ? isoDate.match(/^(\d{4})-(\d{2})-(\d{2})$/) : null;
            if (!match) return isoDate || '';
            return `${MONTH_NAMES[Number(match[2]) - 1]} ${Number(match[3])}, ${match[1]}`;
        }

        function monthLabel(monthKey) {
            const match = monthKey.match(/^(\d{4})-(\d{2})$/);
            if (!match) return monthKey;
            return `${MONTH_NAMES[Number(match[2]) - 1]} ${match[1]}`;
        }

        // GA4 is loaded by layout.js. Guarded so this stays safe on any page
        // that doesn't pull in the shared loader.
        function track(eventName, params) {
            if (typeof window.gtag === 'function') window.gtag('event', eventName, params || {});
        }

        let searchTrackTimer = null;

        // Posts matching the current search term and month filter. Shared by the
        // renderer, the pager and "Surprise me" so they cannot disagree.
        function matchingPosts() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            return allPosts.filter(post => {
                const matchesSearch = !searchTerm
                    || post.title.toLowerCase().includes(searchTerm)
                    || (post.excerpt && post.excerpt.toLowerCase().includes(searchTerm));
                const matchesMonth = !activeMonth || String(post.date || '').startsWith(activeMonth);
                return matchesSearch && matchesMonth;
            });
        }

        function restoreStateFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            const page = parseInt(params.get('page'), 10);
            // ?month=YYYY-MM is what the heatmap cells link to.
            const month = params.get('month');
            if (q) searchInput.value = q;
            if (Number.isInteger(page) && page > 0) currentPage = page;
            activeMonth = /^\d{4}-(0[1-9]|1[0-2])$/.test(month || '') ? month : null;
            updateClearButton();
        }

        function syncStateToUrl() {
            const params = new URLSearchParams();
            const q = searchInput.value.trim();
            if (q) params.set('q', q);
            if (currentPage > 1) params.set('page', currentPage);
            if (activeMonth) params.set('month', activeMonth);
            const qs = params.toString();
            history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
        }

        function updateClearButton() {
            clearSearchBtn.hidden = !searchInput.value;
        }

        function renderMonthChip() {
            monthFilterEl.hidden = !activeMonth;
            if (activeMonth) {
                monthFilterEl.querySelector('.month-filter-label').textContent =
                    `Filtered to ${monthLabel(activeMonth)}`;
            }
        }

        // Placeholder rows so the list area has shape while posts.json loads.
        function renderSkeleton(count) {
            const listEl = document.getElementById('postList');
            listEl.innerHTML = '';
            for (let i = 0; i < count; i += 1) {
                const li = document.createElement('li');
                li.className = 'post-item post-item-skeleton';
                li.setAttribute('aria-hidden', 'true');
                ['title', 'meta', 'text'].forEach((kind) => {
                    const bar = document.createElement('span');
                    bar.className = `skeleton-bar skeleton-${kind}`;
                    li.appendChild(bar);
                });
                listEl.appendChild(li);
            }
        }

        async function loadPosts() {
            renderSkeleton(POSTS_PER_PAGE);
            restoreStateFromUrl();
            // Tracked here rather than in restoreStateFromUrl, which runs a
            // second time when fresh data replaces the cache.
            if (activeMonth) track('month_filter', { month: activeMonth });

            // Paint immediately from the session cache when one exists, then
            // replace it with the network result. The re-render is skipped when
            // the index is unchanged, so repeat visits don't flicker.
            const cached = window.PostsIndex.cached();
            if (cached) {
                allPosts = cached;
                renderPosts();
            }

            try {
                // Shared loader fetches posts.json once per page (also used by the heatmap)
                const posts = await window.PostsIndex.load();
                if (JSON.stringify(posts) !== JSON.stringify(allPosts)) {
                    allPosts = posts;
                    restoreStateFromUrl();
                    renderPosts();
                }
            } catch (error) {
                console.error('Error loading posts:', error);
                if (!allPosts.length) {
                    const li = document.createElement('li');
                    li.className = 'empty-state';
                    li.textContent = 'Error loading posts. Please try again later.';
                    const listEl = document.getElementById('postList');
                    listEl.innerHTML = '';
                    listEl.appendChild(li);
                }
            }
        }

        function renderLatest(post) {
            const link = document.getElementById('latestPost');
            link.href = post.url || `view.html?post=${encodeURIComponent(post.filename)}`;
            document.getElementById('latestTitle').textContent = post.title;
            document.getElementById('latestCount').textContent = `01 / ${allPosts.length}`;
            document.getElementById('latestMeta').textContent = `${formatDisplayDate(post.date)}${post.minutes ? ` · ${post.minutes} min read` : ''}`;
            const excerpt = document.getElementById('latestExcerpt');
            excerpt.textContent = '';
            const numbered = String(post.excerpt || '').split(/(?:^|\s)\d+\.\s+/).filter(Boolean);
            if (numbered.length > 1) {
                numbered.slice(0, 3).forEach((text, i) => {
                    const li = document.createElement('li');
                    const number = document.createElement('span');
                    number.textContent = String(i + 1).padStart(2, '0');
                    li.appendChild(number);
                    li.appendChild(document.createTextNode(text));
                    excerpt.appendChild(li);
                });
            } else {
                const li = document.createElement('li');
                li.textContent = String(post.excerpt || '').slice(0, 180);
                excerpt.appendChild(li);
            }
        }

        function renderPosts() {
            const filteredPosts = matchingPosts();
            const showFeature = !searchInput.value.trim() && !activeMonth && currentPage === 1 && allPosts.length > 0;
            document.getElementById('latestPost').hidden = !showFeature;
            document.querySelector('.list-toolbar').classList.toggle('filtered', !!searchInput.value.trim() || !!activeMonth);
            document.getElementById('archiveHeading').textContent = showFeature ? 'More from the notebook' : 'Writing';
            if (showFeature) renderLatest(allPosts[0]);

            // Pagination
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            currentPage = Math.min(Math.max(1, currentPage), Math.max(1, totalPages));

            const start = (currentPage - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const displayedPosts = filteredPosts.slice(start, end);

            const listEl = document.getElementById('postList');
            listEl.innerHTML = '';

            if (displayedPosts.length === 0) {
                const li = document.createElement('li');
                li.className = 'empty-state';
                if (searchInput.value.trim()) {
                    li.textContent = 'No posts found matching your search.';
                } else if (activeMonth) {
                    li.textContent = `No posts published in ${monthLabel(activeMonth)}.`;
                } else {
                    li.textContent = 'No posts yet.';
                }
                listEl.appendChild(li);
            } else {
                // Build DOM nodes with textContent rather than innerHTML so post
                // metadata (titles, excerpts) can never inject markup into the page.
                displayedPosts.forEach((post, index) => {
                    if (showFeature && index === 0) return;
                    const li = document.createElement('li');
                    li.className = 'post-item story';

                    const titleLink = document.createElement('a');
                    titleLink.href = post.url || `view.html?post=${encodeURIComponent(post.filename)}`;
                    titleLink.className = 'post-title-link';
                    titleLink.textContent = post.title;
                    li.appendChild(titleLink);

                    const meta = document.createElement('div');
                    meta.className = 'post-list-meta';

                    // Real <time> element + the same human date the post pages use.
                    const dateSpan = document.createElement('time');
                    dateSpan.className = 'post-date';
                    if (/^\d{4}-\d{2}-\d{2}$/.test(post.date || '')) {
                        dateSpan.setAttribute('datetime', post.date);
                    }
                    dateSpan.textContent = formatDisplayDate(post.date);
                    meta.appendChild(dateSpan);

                    if (post.minutes) {
                        const sep = document.createElement('span');
                        sep.className = 'post-meta-sep';
                        sep.setAttribute('aria-hidden', 'true');
                        sep.textContent = '·';
                        meta.appendChild(sep);

                        const readTime = document.createElement('span');
                        readTime.className = 'post-read-time';
                        readTime.textContent = `${post.minutes} min read`;
                        meta.appendChild(readTime);
                    }

                    const top = document.createElement('div');
                    top.className = 'story-top';
                    const number = document.createElement('span');
                    number.textContent = String(start + index + 1).padStart(2, '0');
                    top.appendChild(number);
                    top.appendChild(meta);
                    li.insertBefore(top, titleLink);

                    if (post.excerpt) {
                        const excerptDiv = document.createElement('div');
                        excerptDiv.className = 'post-excerpt';
                        excerptDiv.textContent = post.excerpt.substring(0, 160).trimEnd() + '…';
                        li.appendChild(excerptDiv);
                    }

                    li.style.animationDelay = `${index * 0.04}s`;
                    listEl.appendChild(li);
                });
            }

            // Announced to screen readers whenever the list changes.
            const total = filteredPosts.length;
            document.getElementById('resultCount').textContent = total === 0
                ? 'No matching posts'
                : `Showing ${displayedPosts.length} of ${total} post${total === 1 ? '' : 's'}`;

            renderMonthChip();

            // Update UI
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            syncStateToUrl();
        }

        // Event Listeners
        searchInput.addEventListener('input', () => {
            currentPage = 1; // Reset to first page on search
            updateClearButton();
            renderPosts();

            // Debounced so a typed query reports once, not once per keystroke.
            clearTimeout(searchTrackTimer);
            const term = searchInput.value.trim();
            searchTrackTimer = setTimeout(() => {
                if (term) track('search', { search_term: term });
            }, 600);
        });

        function resetSearch() {
            searchInput.value = '';
            currentPage = 1;
            updateClearButton();
            renderPosts();
        }

        clearSearchBtn.addEventListener('click', () => {
            resetSearch();
            searchInput.focus();
        });

        document.getElementById('clearMonth').addEventListener('click', () => {
            activeMonth = null;
            currentPage = 1;
            renderPosts();
            track('month_filter_clear');
        });

        // "/" focuses search and Escape clears it. Ignored while typing in a
        // field so the shortcut can't swallow normal input.
        document.addEventListener('keydown', (event) => {
            const active = document.activeElement;
            const tag = active ? active.tagName : '';
            const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (active && active.isContentEditable);

            if (event.key === '/' && !typing) {
                event.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (event.key === 'Escape' && active === searchInput && searchInput.value) {
                resetSearch();
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPosts();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            // Uses the shared matcher so paging agrees with what is rendered.
            const totalPages = Math.ceil(matchingPosts().length / POSTS_PER_PAGE);
            if (currentPage < totalPages) {
                currentPage++;
                renderPosts();
            }
        });

        // Surprise Me Button — respects the active search/month filter, falling
        // back to the whole archive when the filter has no matches.
        document.getElementById('surpriseBtn').addEventListener('click', () => {
            const matches = matchingPosts();
            const pool = matches.length ? matches : allPosts;
            if (pool.length > 0) {
                const randomPost = pool[Math.floor(Math.random() * pool.length)];
                track('surprise_me', { post: randomPost.filename });
                window.location.href = randomPost.url || `view.html?post=${encodeURIComponent(randomPost.filename)}`;
            }
        });

        loadPosts();
    </script>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        function applyTheme(theme) {
            htmlElement.classList.toggle('light-mode', theme === 'light');
            htmlElement.classList.toggle('dark-mode', theme !== 'light');
        }
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
        applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
        themeToggle.checked = savedTheme !== 'dark';
        themeToggle.addEventListener('change', function () {
            const theme = this.checked ? 'light' : 'dark';
            applyTheme(theme);
            try { localStorage.setItem('theme', theme); } catch (e) {}
            if (typeof window.gtag === 'function') window.gtag('event', 'theme_change', { theme });
        });
    </script>
</body>
</html>
