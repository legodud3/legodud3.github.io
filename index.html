<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="lmFDY0l32f8kD6EDtlCfxcfhLTnHQ4LMBchWTosVYJs" />
    <title>Chinmay Deo</title>
    <meta name="description" content="Personal blog of Chinmay Deo â short posts on learning, tech, and life.">
    <meta property="og:title" content="Chinmay Deo">
    <meta property="og:description" content="Personal blog of Chinmay Deo â short posts on learning, tech, and life.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://legodud3.github.io/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://legodud3.github.io/">
    <script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode');</script>
    <link rel="icon" type="image/png" href="legohat_logo.png">
    <link rel="alternate" type="application/atom+xml" title="Chinmay Deo â Writing" href="feed.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
    <div class="app-shell">
        <aside class="left-rail" data-layout-rail></aside>

        <main class="main-panel">
            <header class="page-header">
                <h1>Writing</h1>
            </header>

            <div class="search-container">
                <label for="searchInput" class="sr-only">Search posts</label>
                <input type="text" id="searchInput" placeholder="Search posts..." aria-label="Search posts">
            </div>

            <div class="tag-and-surprise-container">
                <div id="tagFilters" class="tag-filter-container">
                    <!-- Tag buttons will be injected here -->
                </div>
                <button id="surpriseBtn" class="surprise-btn">â¨ Surprise me</button>
            </div>

            <ul id="postList" class="post-list">
                <!-- Posts will be injected here -->
            </ul>

            <div class="pagination">
                <button id="prevBtn" class="nav-btn" disabled>â Newer</button>
                <span id="pageInfo"></span>
                <button id="nextBtn" class="nav-btn">Older â</button>
            </div>

            <footer class="site-footer" data-layout-footer></footer>
        </main>
    </div>

    <script src="layout.js"></script>
    <script src="monthly-heatmap.js"></script>
    <script>
        let allPosts = [];
        let currentPage = 1;
        let activeTag = null;
        const POSTS_PER_PAGE = 10;

        function restoreStateFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            const tag = params.get('tag');
            const page = parseInt(params.get('page'), 10);
            if (q) document.getElementById('searchInput').value = q;
            if (tag) activeTag = tag;
            if (Number.isInteger(page) && page > 0) currentPage = page;
        }

        function syncStateToUrl() {
            const params = new URLSearchParams();
            const q = document.getElementById('searchInput').value.trim();
            if (q) params.set('q', q);
            if (activeTag) params.set('tag', activeTag);
            if (currentPage > 1) params.set('page', currentPage);
            const qs = params.toString();
            history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
        }

        async function loadPosts() {
            try {
                // Shared loader fetches posts.json once per page (also used by the heatmap)
                allPosts = await window.PostsIndex.load();
                restoreStateFromUrl();
                renderTagFilters();
                renderPosts();
            } catch (error) {
                console.error('Error loading posts:', error);
                const li = document.createElement('li');
                li.textContent = 'Error loading posts. Please try again later.';
                const listEl = document.getElementById('postList');
                listEl.innerHTML = '';
                listEl.appendChild(li);
            }
        }

        function renderTagFilters() {
            const tagCounts = {};
            allPosts.forEach(post => {
                if (post.tag_key) {
                    if (!tagCounts[post.tag_key]) {
                        tagCounts[post.tag_key] = {
                            count: 0,
                            name: post.tag_name,
                            color: post.tag_color
                        };
                    }
                    tagCounts[post.tag_key].count++;
                }
            });

            // Convert to array and sort by count desc
            const sortedTags = Object.entries(tagCounts)
                .sort((a, b) => b[1].count - a[1].count)
                .slice(0, 3); // Top 3

            const filterContainer = document.getElementById('tagFilters');
            filterContainer.innerHTML = '';

            if (sortedTags.length > 0) {
                 const allBtn = document.createElement('button');
                 allBtn.className = 'tag-filter-btn';
                 allBtn.dataset.tagKey = 'all';
                 if (!activeTag) allBtn.classList.add('active');
                 allBtn.textContent = 'All';
                 allBtn.onclick = () => {
                     activeTag = null;
                     currentPage = 1;
                     updateTagFilterActiveState();
                     renderPosts();
                 };
                 filterContainer.appendChild(allBtn);

                 sortedTags.forEach(([key, info]) => {
                     const btn = document.createElement('button');
                     btn.className = 'tag-filter-btn';
                     btn.dataset.tagKey = key;
                     btn.dataset.tagColor = info.color;
                     btn.className = `tag-filter-btn tag-${key}`;
                     if (activeTag === key) {
                         btn.classList.add('active');
                     }

                     btn.textContent = `${info.name} (${info.count})`;

                     btn.onclick = () => {
                         activeTag = (activeTag === key) ? null : key;
                         currentPage = 1;
                         updateTagFilterActiveState();
                         renderPosts();
                     };
                     filterContainer.appendChild(btn);
                 });
            }
            updateTagFilterActiveState();
        }

        function updateTagFilterActiveState() {
            const filterButtons = document.querySelectorAll('.tag-filter-btn');
            filterButtons.forEach(btn => {
                const tagKey = btn.dataset.tagKey;

                if (tagKey === 'all') {
                    // Handle "All" button
                    if (!activeTag) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                } else {
                    // Handle tag-specific buttons
                    const tagColor = btn.dataset.tagColor;
                    if (activeTag === tagKey) {
                        btn.classList.add('active');
                        btn.style.backgroundColor = tagColor;
                        btn.style.color = '#fff';
                        btn.style.border = '1px solid ' + tagColor;
                    } else {
                        btn.classList.remove('active');
                        btn.style.backgroundColor = '';
                        btn.style.color = tagColor;
                        btn.style.borderColor = tagColor;
                    }
                }
            });
        }

        function renderPosts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredPosts = allPosts.filter(post => {
                const matchesSearch = post.title.toLowerCase().includes(searchTerm)
                    || (post.excerpt && post.excerpt.toLowerCase().includes(searchTerm));
                const matchesTag = activeTag ? post.tag_key === activeTag : true;
                return matchesSearch && matchesTag;
            });

            // Pagination
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            currentPage = Math.min(Math.max(1, currentPage), Math.max(1, totalPages));

            const start = (currentPage - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const displayedPosts = filteredPosts.slice(start, end);

            const listEl = document.getElementById('postList');
            listEl.innerHTML = '';

            if (displayedPosts.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No posts found.';
                listEl.appendChild(li);
            } else {
                // Build DOM nodes with textContent rather than innerHTML so post
                // metadata (titles, excerpts) can never inject markup into the page.
                displayedPosts.forEach((post, index) => {
                    const li = document.createElement('li');
                    li.className = 'post-item';

                    const titleLink = document.createElement('a');
                    titleLink.href = post.url || `view.html?post=${encodeURIComponent(post.filename)}`;
                    titleLink.className = 'post-title-link';
                    titleLink.textContent = post.title;
                    li.appendChild(titleLink);

                    const meta = document.createElement('div');
                    meta.className = 'post-list-meta';
                    const dateSpan = document.createElement('span');
                    dateSpan.className = 'post-date';
                    dateSpan.textContent = post.date;
                    meta.appendChild(dateSpan);
                    if (post.tag_name && post.tag_key) {
                        const tagSpan = document.createElement('span');
                        tagSpan.className = `post-tag tag-${post.tag_key}`;
                        tagSpan.textContent = `[${post.tag_name}]`;
                        meta.appendChild(tagSpan);
                    }
                    li.appendChild(meta);

                    if (post.excerpt) {
                        const excerptDiv = document.createElement('div');
                        excerptDiv.className = 'post-excerpt';
                        excerptDiv.textContent = post.excerpt.substring(0, 160).trimEnd() + 'â¦';
                        li.appendChild(excerptDiv);
                    }

                    li.style.animationDelay = `${index * 0.04}s`;
                    listEl.appendChild(li);
                });
            }

            // Update UI
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            syncStateToUrl();
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1; // Reset to first page on search
            renderPosts();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPosts();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
             const searchTerm = document.getElementById('searchInput').value.toLowerCase();
             const filtered = allPosts.filter(post => {
                const matchesSearch = post.title.toLowerCase().includes(searchTerm)
                    || (post.excerpt && post.excerpt.toLowerCase().includes(searchTerm));
                const matchesTag = activeTag ? post.tag_key === activeTag : true;
                return matchesSearch && matchesTag;
            });
             if (currentPage < Math.ceil(filtered.length / POSTS_PER_PAGE)) {
                 currentPage++;
                 renderPosts();
             }
        });

        // Surprise Me Button
        document.getElementById('surpriseBtn').addEventListener('click', () => {
            if (allPosts.length > 0) {
                const randomIndex = Math.floor(Math.random() * allPosts.length);
                const randomPost = allPosts[randomIndex];
                window.location.href = randomPost.url || `view.html?post=${encodeURIComponent(randomPost.filename)}`;
            }
        });

        loadPosts();
    </script>

    <script src="theme-toggle.js"></script>
</body>
</html>
