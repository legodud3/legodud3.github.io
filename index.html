c<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinmay Deo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Writing</h1>
        <nav>
            <a href="about.html">About me</a>
        </nav>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search posts...">
    </div>

    <div id="tagFilters" class="tag-filter-container">
        <!-- Tag buttons will be injected here -->
    </div>

    <ul id="postList" class="post-list">
        <!-- Posts will be injected here -->
    </ul>

    <div class="pagination">
        <button id="prevBtn" class="nav-btn" disabled>← Newer</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="nav-btn">Older →</button>
    </div>

    <script>
        let allPosts = [];
        let currentPage = 1;
        let activeTag = null;
        const POSTS_PER_PAGE = 10;

        async function loadPosts() {
            try {
                // Add timestamp to prevent caching of the posts list
                const response = await fetch('posts.json?v=' + new Date().getTime());
                allPosts = await response.json();
                renderTagFilters();
                renderPosts();
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('postList').innerHTML = '<li>Error loading posts. Please try again later.</li>';
            }
        }

        function renderTagFilters() {
            const tagCounts = {};
            allPosts.forEach(post => {
                if (post.tag_key) {
                    if (!tagCounts[post.tag_key]) {
                        tagCounts[post.tag_key] = {
                            count: 0,
                            name: post.tag_name,
                            color: post.tag_color
                        };
                    }
                    tagCounts[post.tag_key].count++;
                }
            });

            // Convert to array and sort by count desc
            const sortedTags = Object.entries(tagCounts)
                .sort((a, b) => b[1].count - a[1].count)
                .slice(0, 3); // Top 3

            const filterContainer = document.getElementById('tagFilters');
            filterContainer.innerHTML = '';

            if (sortedTags.length > 0) {
                 const allBtn = document.createElement('button');
                 allBtn.className = 'tag-filter-btn';
                 if (!activeTag) allBtn.classList.add('active');
                 allBtn.textContent = 'All';
                 allBtn.onclick = () => {
                     activeTag = null;
                     currentPage = 1;
                     renderTagFilters();
                     renderPosts();
                 };
                 filterContainer.appendChild(allBtn);

                 sortedTags.forEach(([key, info]) => {
                     const btn = document.createElement('button');
                     btn.className = `tag-filter-btn tag-${key}`;
                     if (activeTag === key) {
                         btn.classList.add('active');
                     }

                     btn.textContent = `${info.name} (${info.count})`;

                     btn.onclick = () => {
                         activeTag = (activeTag === key) ? null : key;
                         currentPage = 1;
                         renderTagFilters();
                         renderPosts();
                     };
                     filterContainer.appendChild(btn);
                 });
            }
        }

        function renderPosts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredPosts = allPosts.filter(post => {
                const matchesSearch = post.title.toLowerCase().includes(searchTerm);
                const matchesTag = activeTag ? post.tag_key === activeTag : true;
                return matchesSearch && matchesTag;
            });

            // Pagination
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            currentPage = Math.min(Math.max(1, currentPage), Math.max(1, totalPages));
            
            const start = (currentPage - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const displayedPosts = filteredPosts.slice(start, end);

            const listEl = document.getElementById('postList');
            listEl.innerHTML = '';

            if (displayedPosts.length === 0) {
                listEl.innerHTML = '<li>No posts found.</li>';
            } else {
                displayedPosts.forEach((post, index) => {
                    const li = document.createElement('li');
                    li.className = 'post-item';

                    let tagHtml = '';
                    if (post.tag_name && post.tag_key) {
                        tagHtml = `<span class="post-tag tag-${post.tag_key}">[${post.tag_name}]</span>`;
                    }

                    li.innerHTML = `
                        ${allPosts.length - allPosts.indexOf(post)}. 
                        <a href="view.html?post=${encodeURIComponent(post.filename)}">${post.title}</a>
                        <span class="post-date">[${post.date}]</span>
                        ${tagHtml}
                    `;
                    listEl.appendChild(li);
                });
            }

            // Update UI
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1; // Reset to first page on search
            renderPosts();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPosts();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
             const searchTerm = document.getElementById('searchInput').value.toLowerCase();
             const filtered = allPosts.filter(post => {
                const matchesSearch = post.title.toLowerCase().includes(searchTerm);
                const matchesTag = activeTag ? post.tag_key === activeTag : true;
                return matchesSearch && matchesTag;
            });
             if (currentPage < Math.ceil(filtered.length / POSTS_PER_PAGE)) {
                 currentPage++;
                 renderPosts();
             }
        });

        loadPosts();
    </script>

    <footer class="site-footer">
        <p>All writing is personal. Views are my own and do not represent my employer, friends, or family.</p>
    </footer>
</body>
</html>
