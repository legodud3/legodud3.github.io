---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
  
  {{ content }}
  
  <hr>
  
  <div class="post-footer">
    <a href="/">← Back to posts</a>
  </div>
</article>

<style>
  article {
    max-width: 800px;
    margin: 20px 0;
  }
  
  .post-date {
    color: #666;
    font-size: 14px;
    margin: 10px 0;
  }
  
  .post-footer {
    margin-top: 30px;
    padding-top: 20px;
  }
  
  .post-footer a {
    color: #007acc;
    text-decoration: none;
  }
  
  .post-footer a:hover {
    text-decoration: underline;
  }
</style>
