<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post View</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="left-rail">
            <a href="index.html" class="rail-brand">
                <img src="legohat_logo.png" alt="Logo" class="site-logo">
                <span>Chinmay Deo</span>
            </a>
            <nav class="rail-nav" aria-label="Primary">
                <a href="write.html">✍️ Write</a>
                <a href="about.html">👤 About me</a>
                <a href="side-projects.html">🚀 Side projects</a>
            </nav>
            <section class="rail-widget">
                <h2 class="rail-section-title">Writing Consistency</h2>
                <div class="monthly-heatmap-root" aria-live="polite"></div>
                <p class="rail-hat-tip">Hat tip to <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a> for the original contribution graph inspiration.</p>
            </section>
        </aside>

        <main class="main-panel">
            <header class="page-header page-header-slim">
                <a href="index.html" class="back-link" style="margin: 0;">← Back to Posts</a>
            </header>

            <div id="content" class="markdown-body">
                Loading...
            </div>

            <div class="post-nav">
                <a id="newerPost" href="#"></a>
                <a id="olderPost" href="#"></a>
            </div>

            <footer class="site-footer">
                <p>All writing is personal. Views are my own and do not represent my employer, friends, or family.</p>
                <div class="theme-toggle-container">
                    <span class="theme-toggle-label">Dark</span>
                    <label class="theme-toggle-switch">
                        <input type="checkbox" id="themeToggle" role="switch" aria-label="Toggle between dark and light theme">
                        <span class="theme-toggle-slider"></span>
                    </label>
                    <span class="theme-toggle-label">Light</span>
                </div>
            </footer>
        </main>
    </div>

    <script src="monthly-heatmap.js"></script>
    <script src="theme-toggle.js"></script>

    <script>
        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('post');

            if (!filename) {
                document.getElementById('content').innerHTML = 'Post not specified.';
                return;
            }
            if (filename.includes('..') || filename.startsWith('/') || filename.startsWith('\\')) {
                document.getElementById('content').innerHTML = 'Invalid post path.';
                return;
            }

            try {
                // Fetch the raw markdown content
                const response = await fetch(`posts/${filename}`);
                if (!response.ok) throw new Error('Post not found');

                const text = await response.text();

                // Parse Frontmatter (simple render, stripping it out mostly for the display)
                let markdownContent = text;

                // Simple frontmatter extractor
                if (text.startsWith('---')) {
                    const end = text.indexOf('---', 3);
                    if (end !== -1) {
                        const frontmatter = text.substring(0, end + 3);
                        markdownContent = text.substring(end + 3).trim();

                        // Parse title from YAML to set document title
                        try {
                            // Removing --- for yaml parser
                            const yamlText = frontmatter.replace(/^---\n/, '').replace(/\n---$/, '');
                            const meta = jsyaml.load(yamlText);
                            if (meta.title) {
                                document.title = meta.title;
                                // Optionally inject title as H1 if not present in markdown
                            }
                        } catch (e) {
                            console.error('YAML parsing error', e);
                        }
                    }
                }

                // Render Markdown
                const contentEl = document.getElementById('content');
                const renderedHtml = marked.parse(markdownContent);
                contentEl.innerHTML = DOMPurify.sanitize(renderedHtml);

                // Load Navigation and Meta
                try {
                    const postsResponse = await fetch('posts.json?v=' + new Date().getTime());
                    const posts = await postsResponse.json();
                    const currentIndex = posts.findIndex(p => p.filename === filename);

                    if (currentIndex !== -1) {
                        const currentPost = posts[currentIndex];

                        // Inject Meta (Tag + Date)
                        if (currentPost) {
                            const metaDiv = document.createElement('div');
                            metaDiv.className = 'post-meta';

                            if (currentPost.tag_name && currentPost.tag_key) {
                                const tagSpan = document.createElement('span');
                                tagSpan.className = `post-tag tag-${currentPost.tag_key}`;
                                tagSpan.textContent = `[${currentPost.tag_name}]`;
                                metaDiv.appendChild(tagSpan);
                            }
                            metaDiv.appendChild(document.createTextNode(`[${currentPost.date}]`));

                            const h1 = contentEl.querySelector('h1');
                            if (h1) {
                                h1.parentNode.insertBefore(metaDiv, h1.nextSibling);
                            } else {
                                contentEl.insertBefore(metaDiv, contentEl.firstChild);
                            }
                        }

                        const newerPost = posts[currentIndex - 1];
                        const olderPost = posts[currentIndex + 1];

                        if (newerPost) {
                            const newerLink = document.getElementById('newerPost');
                            newerLink.href = `view.html?post=${encodeURIComponent(newerPost.filename)}`;
                            newerLink.textContent = `← ${newerPost.title}`;
                            newerLink.classList.add('visible');
                        }

                        if (olderPost) {
                            const olderLink = document.getElementById('olderPost');
                            olderLink.href = `view.html?post=${encodeURIComponent(olderPost.filename)}`;
                            olderLink.textContent = `${olderPost.title} →`;
                            olderLink.classList.add('visible');
                        }
                    }
                } catch (e) {
                    console.error('Error loading navigation', e);
                }

            } catch (error) {
                document.getElementById('content').innerHTML = `Error loading post: ${error.message} <br> <small>Tried to load: posts/${filename}</small>`;
            }
        }

        loadPost();
    </script>
</body>
</html>
