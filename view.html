<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post View</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="left-rail">
            <a href="index.html" class="rail-brand">
                <img src="legohat_logo.png" alt="Logo" class="site-logo">
                <span>Chinmay Deo</span>
            </a>
            <nav class="rail-nav" aria-label="Primary">
                <a href="index.html">🏠 Home</a>
                <a href="about.html">👤 About me</a>
                <a href="side-projects.html">🚀 Side projects</a>
                <a href="write.html">✍️ Write</a>
            </nav>
            <section class="rail-widget">
                <h2 class="rail-section-title">Writing Consistency</h2>
                <div class="monthly-heatmap-root" aria-live="polite"></div>
                <p class="rail-hat-tip">Hat tip to <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a> for the original contribution graph inspiration.</p>
            </section>
        </aside>

        <main class="main-panel">
            <header class="page-header page-header-slim">
                <a href="index.html" class="back-link" style="margin: 0;">← Back to Posts</a>
            </header>

            <div id="content" class="markdown-body">
                Loading...
            </div>

            <div class="post-nav">
                <a id="newerPost" href="#"></a>
                <a id="olderPost" href="#"></a>
            </div>

            <section id="related-posts" class="related-posts-section" aria-label="Related posts" hidden>
                <h2 class="related-posts-heading">Related Posts</h2>
                <div id="related-posts-grid" class="related-posts-grid"></div>
            </section>

            <footer class="site-footer">
                <p>All writing is personal. Views are my own and do not represent my employer, friends, or family.</p>
                <div class="theme-toggle-container">
                    <span class="theme-toggle-label">Dark</span>
                    <label class="theme-toggle-switch">
                        <input type="checkbox" id="themeToggle" role="switch" aria-label="Toggle between dark and light theme">
                        <span class="theme-toggle-slider"></span>
                    </label>
                    <span class="theme-toggle-label">Light</span>
                </div>
            </footer>
        </main>
    </div>

    <script src="monthly-heatmap.js"></script>
    <script src="theme-toggle.js"></script>

    <script>
        function getRelatedPosts(posts, currentPost, count = 3) {
            const significantWords = (text) => new Set(
                text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 4)
            );

            const currentWords = currentPost.excerpt ? significantWords(currentPost.excerpt) : new Set();

            const scored = posts
                .filter(p => p.filename !== currentPost.filename)
                .map(p => {
                    let score = 0;
                    if (p.tag_key && p.tag_key === currentPost.tag_key) score += 3;
                    if (p.excerpt && currentWords.size > 0) {
                        for (const word of significantWords(p.excerpt)) {
                            if (currentWords.has(word)) score += 1;
                        }
                    }
                    return { post: p, score };
                })
                .sort((a, b) => b.score - a.score);

            if (scored.every(item => item.score === 0)) {
                return posts.filter(p => p.filename !== currentPost.filename).slice(0, count);
            }
            return scored.slice(0, count).map(item => item.post);
        }

        function renderRelatedPosts(relatedPosts) {
            const section = document.getElementById('related-posts');
            const grid = document.getElementById('related-posts-grid');
            if (!relatedPosts || relatedPosts.length === 0) return;

            grid.innerHTML = '';
            relatedPosts.forEach(post => {
                const snippet = post.excerpt ? post.excerpt.substring(0, 100).trimEnd() + '…' : '';
                const card = document.createElement('a');
                card.className = 'related-post-card';
                card.href = `view.html?post=${encodeURIComponent(post.filename)}`;

                let tagHtml = '';
                if (post.tag_name && post.tag_key) {
                    tagHtml = `<span class="post-tag tag-${post.tag_key}">[${post.tag_name}]</span>`;
                }

                card.innerHTML = `
                    <div class="related-post-title">${post.title}</div>
                    <div><span class="post-date">[${post.date}]</span> ${tagHtml}</div>
                    <div class="related-post-excerpt">${snippet}</div>
                `;
                grid.appendChild(card);
            });
            section.hidden = false;
        }

        function formatTime(s) {
            if (!isFinite(s) || isNaN(s)) return '--:--';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        function createLegoPlayer(mp3Url, label) {
            const BRICK_COUNT = 28;

            const wrapper = document.createElement('div');
            wrapper.className = 'lego-audio-player';

            const audio = document.createElement('audio');
            audio.preload = 'metadata';
            audio.src = mp3Url;
            audio.style.display = 'none';

            const controlsRow = document.createElement('div');
            controlsRow.className = 'lego-controls-row';

            const playBtn = document.createElement('button');
            playBtn.className = 'lego-play-btn';
            playBtn.setAttribute('aria-label', 'Play');
            playBtn.innerHTML = '&#9654;';

            const bricksRow = document.createElement('div');
            bricksRow.className = 'lego-bricks-row';

            const bricks = [];
            for (let i = 0; i < BRICK_COUNT; i++) {
                const brick = document.createElement('div');
                brick.className = 'lego-brick';
                brick.addEventListener('click', () => {
                    if (audio.duration) audio.currentTime = (i / BRICK_COUNT) * audio.duration;
                });
                bricksRow.appendChild(brick);
                bricks.push(brick);
            }

            const timeDisplay = document.createElement('span');
            timeDisplay.className = 'lego-time';
            timeDisplay.textContent = '--:--';

            controlsRow.appendChild(playBtn);
            controlsRow.appendChild(bricksRow);
            controlsRow.appendChild(timeDisplay);

            const labelEl = document.createElement('div');
            labelEl.className = 'lego-audio-label';
            labelEl.textContent = label;

            playBtn.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
            audio.addEventListener('play', () => {
                playBtn.innerHTML = '&#9646;&#9646;';
                playBtn.setAttribute('aria-label', 'Pause');
            });
            audio.addEventListener('pause', () => {
                playBtn.innerHTML = '&#9654;';
                playBtn.setAttribute('aria-label', 'Play');
            });
            audio.addEventListener('ended', () => {
                playBtn.innerHTML = '&#9654;';
                playBtn.setAttribute('aria-label', 'Play');
            });

            function updateBricks() {
                const progress = audio.duration ? audio.currentTime / audio.duration : 0;
                const playedCount = Math.floor(progress * BRICK_COUNT);
                bricks.forEach((brick, i) =>
                    brick.classList.toggle('lego-brick-played', i < playedCount)
                );
                timeDisplay.textContent =
                    `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }

            audio.addEventListener('timeupdate', updateBricks);
            audio.addEventListener('loadedmetadata', updateBricks);

            wrapper.appendChild(controlsRow);
            wrapper.appendChild(labelEl);
            wrapper.appendChild(audio);

            return wrapper;
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('post');

            if (!filename) {
                document.getElementById('content').innerHTML = 'Post not specified.';
                return;
            }
            if (filename.includes('..') || filename.startsWith('/') || filename.startsWith('\\')) {
                document.getElementById('content').innerHTML = 'Invalid post path.';
                return;
            }

            try {
                // Fetch the raw markdown content
                const response = await fetch(`posts/${filename}`);
                if (!response.ok) throw new Error('Post not found');

                const text = await response.text();

                // Parse Frontmatter (simple render, stripping it out mostly for the display)
                let markdownContent = text;
                let postMeta = {};

                // Simple frontmatter extractor
                if (text.startsWith('---')) {
                    const end = text.indexOf('---', 3);
                    if (end !== -1) {
                        const frontmatter = text.substring(0, end + 3);
                        markdownContent = text.substring(end + 3).trim();

                        // Parse title from YAML to set document title
                        try {
                            // Removing --- for yaml parser
                            const yamlText = frontmatter.replace(/^---\n/, '').replace(/\n---$/, '');
                            postMeta = jsyaml.load(yamlText) || {};
                            if (postMeta.title) {
                                document.title = postMeta.title;
                            }
                        } catch (e) {
                            console.error('YAML parsing error', e);
                        }
                    }
                }

                // Render Markdown
                const contentEl = document.getElementById('content');
                const renderedHtml = marked.parse(markdownContent);
                contentEl.innerHTML = DOMPurify.sanitize(renderedHtml);

                // Load Navigation and Meta
                try {
                    const postsResponse = await fetch('posts.json?v=' + new Date().getTime());
                    const posts = await postsResponse.json();
                    const currentIndex = posts.findIndex(p => p.filename === filename);

                    if (currentIndex !== -1) {
                        const currentPost = posts[currentIndex];

                        // Inject Meta (Tag + Date)
                        if (currentPost) {
                            const metaDiv = document.createElement('div');
                            metaDiv.className = 'post-meta';

                            if (currentPost.tag_name && currentPost.tag_key) {
                                const tagSpan = document.createElement('span');
                                tagSpan.className = `post-tag tag-${currentPost.tag_key}`;
                                tagSpan.textContent = `[${currentPost.tag_name}]`;
                                metaDiv.appendChild(tagSpan);
                            }
                            metaDiv.appendChild(document.createTextNode(`[${currentPost.date}]`));

                            const h1 = contentEl.querySelector('h1');
                            if (h1) {
                                h1.parentNode.insertBefore(metaDiv, h1.nextSibling);
                            } else {
                                contentEl.insertBefore(metaDiv, contentEl.firstChild);
                            }

                            // Inject audio player if a sibling audio file exists (.mp3, .m4a, .webm)
                            let hasAudio = false;
                            const audioExts = ['.mp3', '.m4a', '.webm'];
                            for (const ext of audioExts) {
                                const audioUrl = `posts/${filename.replace(/\.md$/, ext)}`;
                                try {
                                    const audioCheck = await fetch(audioUrl, { method: 'HEAD' });
                                    if (audioCheck.ok) {
                                        const audioLabel = postMeta.audio_label || 'Listen to this post';
                                        const audioWrapper = createLegoPlayer(audioUrl, audioLabel);
                                        metaDiv.parentNode.insertBefore(audioWrapper, metaDiv.nextSibling);
                                        hasAudio = true;
                                        break;
                                    }
                                } catch (e) { /* try next format */ }
                            }
                            if (!hasAudio) {
                                const addAudioLink = document.createElement('a');
                                addAudioLink.href = `write.html?audio_for=${encodeURIComponent(filename)}`;
                                addAudioLink.className = 'add-audio-link';
                                addAudioLink.textContent = '+ Add audio';
                                metaDiv.parentNode.insertBefore(addAudioLink, metaDiv.nextSibling);
                            }
                        }

                        const newerPost = posts[currentIndex - 1];
                        const olderPost = posts[currentIndex + 1];

                        if (newerPost) {
                            const newerLink = document.getElementById('newerPost');
                            newerLink.href = `view.html?post=${encodeURIComponent(newerPost.filename)}`;
                            newerLink.textContent = `← ${newerPost.title}`;
                            newerLink.classList.add('visible');
                        }

                        if (olderPost) {
                            const olderLink = document.getElementById('olderPost');
                            olderLink.href = `view.html?post=${encodeURIComponent(olderPost.filename)}`;
                            olderLink.textContent = `${olderPost.title} →`;
                            olderLink.classList.add('visible');
                        }

                        renderRelatedPosts(getRelatedPosts(posts, currentPost));
                    }
                } catch (e) {
                    console.error('Error loading navigation', e);
                }

            } catch (error) {
                document.getElementById('content').innerHTML = `Error loading post: ${error.message} <br> <small>Tried to load: posts/${filename}</small>`;
            }
        }

        loadPost();
    </script>
</body>
</html>
