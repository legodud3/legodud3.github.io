<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening post… - Chinmay Deo</title>
    <meta name="robots" content="noindex">
    <script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode');</script>
    <link rel="icon" type="image/png" href="legohat_logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-panel" style="max-width: 700px; margin: 60px auto;">
        <p id="redirectMessage">Opening post…</p>
        <p><a href="index.html">← Back to the homepage</a></p>
    </main>
    <script>
        // Legacy shim: posts are now served as pre-rendered static pages at
        // /p/<slug>.html (real titles, OG tags, canonical URLs). Redirect old
        // view.html?post=YYYY/slug.md links so bookmarks and shared URLs keep working.
        (function () {
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('post');

            // Allow list of path shapes we will redirect; anything else
            // (traversal, absolute paths, wrong folders) is refused.
            if (filename && /^\d{4}\/[A-Za-z0-9._\- ]+\.md$/.test(filename)) {
                const slug = filename
                    .replace(/^\d{4}\//, '')
                    .replace(/\.md$/, '')
                    .replace(/\s+/g, '-')     // legacy names that contain spaces
                    .replace(/-copy$/, '');   // stray " copy" duplicate suffix
                window.location.replace('/p/' + encodeURIComponent(slug) + '.html');
                return;
            }
            document.getElementById('redirectMessage').textContent = 'Post not specified or invalid link.';
        })();
    </script>
</body>
</html>
